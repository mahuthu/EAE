services:
  eastafricaexplore:
    build:
      context: .
      dockerfile: Dockerfile
    image: eastafricaexplore:latest
    container_name: eastafricaexplore
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3040}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      COOKIE_SECURE: "true"
    volumes:
      - eastafricaexplore_data:/app/data

volumes:
  eastafricaexplore_data:
    name: eastafricaexplore_data
